name: Update app list

on:
  schedule:
    - cron: "0 21 * * *" # 毎朝 6:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild app list from bcnofne.com/apps.json
        run: python3 scripts/update_apps.py README.md
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update app list from bcnofne.com"
          git push
